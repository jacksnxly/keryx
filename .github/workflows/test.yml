name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Adapter
        working-directory: skills/keryx
        run: python -m unittest discover -s tests
      - name: Benchmark and field recorder
        run: |
          python -m pip install -r bench/requirements.txt
          (cd bench && python -m pytest -q)
          (cd field && python -m pytest -q)
